<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;font-family:-apple-system,"Segoe UI",Inter,system-ui,sans-serif}
.frame{position:relative;overflow:hidden}
#icon{width:256px;height:256px;display:grid;place-items:center;background:#fff}
.banner{background:linear-gradient(135deg,#0d6f68 0%,#0a5a54 55%,#08433f 100%);color:#fff;display:flex;align-items:center;gap:38px;padding:0 64px;position:relative;overflow:hidden}
.banner .grid{position:absolute;inset:0;opacity:.13;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:44px 44px;background-position:-1px -1px}
.banner .glow{position:absolute;inset:auto -120px -220px auto;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(95,201,191,.42),rgba(95,201,191,0) 65%)}
.banner .txt{position:relative;z-index:2}
.banner h1{font-size:52px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.banner h1 i{font-style:normal;color:#7fe3d9}
.banner p{margin-top:12px;font-size:21px;color:#bfe6e2;font-weight:450;letter-spacing:-.01em}
.banner .mk{position:relative;z-index:2;flex:none}
#b772{width:772px;height:250px}
#b772 h1{font-size:40px} #b772 p{font-size:16.5px;margin-top:9px} #b772{padding:0 44px;gap:26px}
#b1544{width:1544px;height:500px}
</style></head><body>
