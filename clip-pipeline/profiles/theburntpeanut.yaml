# Profile for clipping TheBurntPeanut's streams (FPS / extraction shooters, VTuber peanut avatar).
#   clipper stream --video vod.mp4 --chat chat.json --config profiles/theburntpeanut.yaml
#
# His avatar is a 3D peanut with real eyes and mouth; face detection does not
# find it (1 face in 40 samples on a real VOD), so the avatar is found by colour
# and by staying put while the game moves. Each clip gets its own layout:
#   gameplay (peanut bottom-left)  -> peanut on top, gameplay below
#   studio / break scenes (centre) -> 9:16 crop around the peanut
#   anything else                  -> fit (whole stream on a blurred background)
stream:
  layout: auto
  facecam: null
  avatar:                        # measured on VOD 2900094401 (Oct 2026): peanut skin / bandana colours
    enabled: true
    hsv_low: [8, 110, 80]
    hsv_high: [30, 220, 230]
    regions:
      - [0.14, 0.70, 0.20, 0.30]   # gameplay: bottom-left, above the squad bars
  signals:
    chat_delay_s: 5.0            # big chat: reactions arrive a bit later
    ignore_patterns:             # sub notices + the channel's points gambling/duel commands and their replies
      - "subscribed (with|at) (prime|tier)"
      - "gifted (a|\\d+) tier"
      - "is gifting \\d+"
      - "converted from a prime"
      - "continuing the gift sub"
      - "\\bpeanuts\\b.*(won|lost|has|leaderboard|rank)|(won|lost|went all in).*\\bpeanuts\\b"
      - "^!\\w+"                  # chat commands (!gamble, !duel, ...)
    chat_z_full: 5.0
    hype_tokens: [kekw, lul, lulw, omegalul, lmao, lmfao, lol, xd, pog, pogchamp, poggers, pogu, w, ww, www, l, clip, clipit,
                  "clip it", monkas, sadge, icant, "no way", omg, holy, insane, "?", "??", "???", wtf, nooo, letsgo, "lets go", gg, ez,
                  peanut, nut, "💀", "😂", "🤣", "🥜"]
  moments:
    count: 8                     # long streams: more clips per VOD
    pre_roll_s: 14               # shooters: show the fight before the reaction
    post_roll_s: 8
    max_s: 58
