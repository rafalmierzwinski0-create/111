# Every option of the pipeline with its default. A file passed with --config is
# deep-merged over this one, so it only needs the keys it changes.
# See IMPLEMENTATION_PLAN.md section 7 and README.md.

models:
  # Where model files are cached. The CLIPPER_MODEL_DIR environment variable
  # overrides this. Put the files here by hand for fully offline use.
  cache_dir: ~/.cache/clipper/models

detect:
  num_faces: 4                   # maximum faces per frame
  max_fps: 30                    # analyse every n-th frame so the analysed rate <= this
  analysis_max_width: 1280       # downscale wider frames before detection
  min_detection_confidence: 0.5
  min_presence_confidence: 0.5
  min_tracking_confidence: 0.5
  landmarks: subset              # subset (lips + key points) | full (all 478)
  blendshapes: [jawOpen, mouthClose, mouthFunnel, mouthPucker, mouthSmileLeft, mouthSmileRight]
  iou_threshold: 0.2             # minimum IoU to continue a track
  max_center_dist: 0.6           # centre-distance fallback, in face widths
  max_gap_s: 1.0                 # a track ends after this long without a match
  min_track_s: 0.5               # shorter tracks are marked spurious
  shot_threshold: 27.0           # HSV content difference that counts as a hard cut
  min_shot_s: 0.5                # minimum shot length

speakers:
  backend: heuristic             # heuristic | lrasd  (CLI: --asd)
  min_score: 0.5                 # a face counts as speaking in a frame above this score
  min_segment_s: 2.0             # no framing segment is shorter (except at cuts / range edges)
  switch_margin: 0.15            # a new speaker must out-score the current one by this much
  heuristic:
    jaw_weight: 0.5              # weight of the jawOpen blendshape in the mouth signal
    window_s: 0.4                # half-width of the articulation window
    trend_window_s: 1.0          # slow mouth trend removed before measuring articulation
    articulation_mid: 0.03       # articulation at which the score is 0.5
    articulation_scale: 0.008    # logistic steepness
    yaw_full: 35.0               # |yaw| up to this keeps the full score
    yaw_zero: 70.0               # |yaw| at which the score drops to 0
    min_face_height: 0.08        # faces smaller than this fraction of frame height are penalised
    audio_gating: true           # zero all scores where the audio has no speech energy
    audio_window_s: 0.2          # RMS window for the speech gate
    silence_db: -60.0            # loudest moment below this -> no usable audio, gating disabled
    speech_margin_db: 12.0       # speech is this much above the noise floor ...
    speech_floor_db: -45.0       # ... and at least this loud
    gate_hold_s: 0.3             # keep the gate open across pauses between words
    noise_percentile: 3.0        # noise floor = this percentile of the audio level
  lrasd:
    weights: finetuning_TalkSet  # finetuning_TalkSet (better on talking-head footage per LR-ASD authors) | pretrain_AVA
    durations: [1, 1, 1, 2, 2, 2, 3, 3, 4, 5, 6]  # chunk lengths (s) averaged, as in LR-ASD's demo
    crop_scale: 0.40             # face crop padding, as in LR-ASD's demo

plan:
  aspect: "9:16"                 # output aspect ratio of the crop
  zoom: 1.0                      # 1.0 = crop is full source height; 1.5 = tighter
  face_y: 0.38                   # face centre at this fraction of the crop height (when zoom leaves room)
  follow_window_s: 1.5           # moving median of the speaker's face position (ignores head motion)
  dead_zone: 0.12                # target changes below this fraction of the crop width do not move the frame
  transition_s: 0.6              # ease-in-out duration of a move (longer if max_speed requires it)
  max_speed: 1.5                 # max camera speed, source frame widths per second
  max_accel: 8.0                 # acceleration bound verified by the checkpoint, frame widths per second^2
  smooth_s: 0.08                 # sigma of the final zero-phase low-pass
  output:
    width: 1080
    height: 1920
    max_fps: 60                  # output frame rate = source frame rate, capped here
    video_codec: libx264
    crf: 18
    preset: medium
    audio_codec: aac
    audio_bitrate: 192k

select:
  scorer: heuristic              # heuristic (local, default) | llm (local LLM re-ranks the heuristic's best)
  target_s: 60                   # ideal clip length
  min_s: 30                      # candidates shorter than this are not considered
  max_s: 90                      # ... nor longer than this
  split_on_speaker_change: true  # a change of speaker also ends a sentence
  pad_start_s: 0.25              # breathing room before the first word, never reaching into the previous sentence
  pad_end_s: 0.5                 # ... and after the last word
  keep_candidates: 10            # how many non-overlapping candidates moment.json lists
  nms_overlap: 0.5               # candidates overlapping a better one by more than this are not listed
  loudness: true                 # use the source audio's loudness in the energy feature
  heuristic:
    weights:                     # relative weights of the features (see README)
      hook: 0.25
      standalone: 0.20
      completeness: 0.20
      density: 0.12
      energy: 0.08
      clean: 0.07
      duration: 0.08
  llm:
    endpoint: http://127.0.0.1:11434   # must be local unless allow_hosted
    api: ollama                  # ollama | openai (any OpenAI-compatible local server)
    model: llama3.1:8b
    allow_hosted: false          # plan 2.1: hosted/paid endpoints are refused unless this is true (or --allow-hosted-llm)
    top_k: 5                     # heuristic candidates the LLM re-ranks
    weight: 0.6                  # final = (1 - weight) * heuristic + weight * llm / 10
    timeout_s: 120

stream:                          # stream mode: `clipper stream` (game / IRL stream VODs)
  layout: auto                   # auto | fit | stacked | gameplay | follow
  facecam: null                  # [x, y, w, h] fractions of the frame: the facecam / VTuber avatar (enables stacked)
  cam_height: 0.35               # stacked: share of the output height for the cam panel
  cam_scale: 2.6                 # stacked, detected face without a detectable overlay border: cam panel height in face heights
  gameplay_x: 0.5                # horizontal centre of the gameplay crop (0 = left edge, 1 = right edge)
  gameplay_zoom: 1.0             # stacked: 1.0 = gameplay crop uses the full source height; 1.3 = 30 % closer
  fit_y: 0.6                     # fit: vertical position of the stream picture (0 = top, 1 = bottom)
  fit_blur: 30                   # fit: background blur
  detect_samples: 40             # frames sampled across the VOD to find a facecam
  detect_min_presence: 0.4       # a face must sit in the same place in this share of samples to count as a facecam
  signals:
    weights: {audio: 0.45, chat: 0.40, speech: 0.15}   # renormalised over the signals you have
    audio_baseline_s: 120        # rolling baseline for loudness
    audio_excess_min_db: 4.0     # loudness above baseline that starts to count
    audio_excess_full_db: 16.0   # ... and counts fully
    audio_floor_db: -50.0        # quieter than this is never hype
    chat_delay_s: 4.0            # chat reacts this many seconds after the moment
    chat_smooth_s: 5             # moving average of chat rate (s)
    chat_baseline_s: 300         # rolling baseline for chat rate
    chat_z_full: 6.0             # robust z-score at which chat counts fully
    hype_weight: 2.0             # a message with a hype emote/word counts this many messages
    hype_tokens: [kekw, lul, lulw, omegalul, lmao, lmfao, lol, xd, pog, pogchamp, poggers, pogu, w, ww, www, l, clip, clipit,
                  "clip it", monkas, sadge, icant, "no way", omg, holy, insane, "?", "??", "???", wtf, nooo, letsgo, "lets go", gg, ez,
                  "💀", "😂", "🤣"]
    smooth_s: 3                  # smoothing of the combined signal (s)
  moments:
    count: 5                     # clips per VOD
    min_hype: 0.35               # peaks below this are not clips
    min_gap_s: 45                # peaks closer than this are one moment
    pre_roll_s: 12               # seconds before the peak (the build-up)
    post_roll_s: 8               # seconds after the peak (the reaction)
    min_s: 15
    max_s: 55
  captions:
    enabled: true                # burn in captions when a transcript is given
    words_per_line: 3
    font: DejaVu Sans
    size: 78
    outline: 6
    color: FFFFFF                # RRGGBB
    highlight: FFE135            # the word being spoken
    uppercase: true
    y: null                      # vertical position (fraction of height); null = where the layout leaves room
  output:
    width: 1080
    height: 1920
    max_fps: 60
    video_codec: libx264
    crf: 20
    preset: medium
    audio_codec: aac
    audio_bitrate: 192k
