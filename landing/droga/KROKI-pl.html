<style>
/* ===========================================================================
   Wszystko pod .lst- , więc Divi zostaje nietknięte — i odwrotnie.
   =========================================================================== */
.lst-kroki {
	/* ---- jedno pokrętło całego bloku ---------------------------------
	   1 = tak jak jest, 1.2 = o jedną piątą większe. Kafelki, litery
	   i odstępy skalują się razem, nic się nie rozjeżdża. */
	--lst-skala: 1;

	/* Grafit tła — trzy liczby, bo tło jest przezroczyste i kolor musi dać się
	   wymieszać z tym, co jest pod spodem. Kafelki liczą się z tego same. */
	--lst-tlo: 30, 36, 35;

	/* Ile tła widać u góry i u dołu. Liczba to KRYCIE, czyli odwrotność
	   przezroczystości: .1 = 90% przezroczystości, .8 = 20% przezroczystości. */
	--lst-tlo-gora: .4;
	--lst-tlo-dol: .8;

	/* Wyliczone z powyższego — tego nie trzeba ruszać. */
	--lst-kafel: calc( 58px * var( --lst-skala ) );
	--lst-luz: calc( 22px * var( --lst-skala ) );
	--lst-bok: calc( 26px * var( --lst-skala ) );

	position: relative;
	display: flex; align-items: flex-start; gap: var( --lst-luz );
	padding: calc( 34px * var( --lst-skala ) ) var( --lst-bok ) calc( 30px * var( --lst-skala ) );
	border: 1px solid rgba( 160, 220, 212, .14 ); border-radius: calc( 16px * var( --lst-skala ) );

	/* Tło narasta ku dołowi: u góry ledwo widoczne, na dole prawie pełne. */
	background: linear-gradient( to bottom, rgba( var( --lst-tlo ), var( --lst-tlo-gora ) ), rgba( var( --lst-tlo ), var( --lst-tlo-dol ) ) );
	font-family: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif; }

.lst-kroki * { box-sizing: border-box; }

/* Edytory lubią wstawiać <br /> w miejsca złamanych wierszy — tu nie ma on nic
   do roboty, więc gdyby się pojawił, ma być niewidoczny. */
.lst-kroki br { display: none; }

.lst-krok { flex: 1 1 0; min-width: 0; position: relative;
	display: flex; flex-direction: column; align-items: center; text-align: center; }

/* Kreska łącząca dwa kolejne kroki — biegnie od kafelka do kafelka, na ich
   wysokości. Rysuje ją krok drugi, trzeci i czwarty, patrząc w lewo. */
.lst-krok + .lst-krok::before { content: ""; position: absolute;
	top: calc( var( --lst-kafel ) / 2 ); height: 1px;
	left: calc( -50% + var( --lst-kafel ) / 2 + var( --lst-luz ) / 2 );
	right: calc( 50% + var( --lst-kafel ) / 2 + var( --lst-luz ) / 2 );
	background: linear-gradient( to right, rgba( 95, 227, 207, 0 ), rgba( 95, 227, 207, .45 ), rgba( 95, 227, 207, 0 ) ); }

/* Jedna strzałka na cały blok. Płynie bez przerwy od pierwszej ikony do
   ostatniej, po kolei przez wszystkie — jak dane wędrujące przez te cztery
   etapy. Tor liczy się sam z szerokości bloku, więc piąty krok niczego nie
   popsuje: strzałka po prostu poleci dalej.

   Dwa końce toru to środek pierwszego i środek ostatniego kafelka. Kroki są
   równej szerokości, więc jeden krok to (szerokość bloku bez boków i bez
   przerw) podzielone przez cztery, a jego środek — jeszcze przez dwa. */
.lst-kroki::after { content: ""; position: absolute; z-index: 0; width: 0; height: 0;
	top: calc( 34px * var( --lst-skala ) + var( --lst-kafel ) / 2 );
	margin-top: calc( -5px * var( --lst-skala ) );
	border-top: calc( 5px * var( --lst-skala ) ) solid transparent;
	border-bottom: calc( 5px * var( --lst-skala ) ) solid transparent;
	border-left: calc( 9px * var( --lst-skala ) ) solid #5fe3cf;
	filter: drop-shadow( 0 0 calc( 7px * var( --lst-skala ) ) rgba( 95, 227, 207, .85 ) );
	animation: lst-plynie 6s linear infinite; }

@keyframes lst-plynie {
	0%   { left: calc( var( --lst-bok ) + ( 100% - 2 * var( --lst-bok ) - 3 * var( --lst-luz ) ) / 8 ); opacity: 0; }
	6%   { opacity: 1; }
	94%  { opacity: 1; }
	100% { left: calc( 100% - var( --lst-bok ) - ( 100% - 2 * var( --lst-bok ) - 3 * var( --lst-luz ) ) / 8 ); opacity: 0; }
}

/* Kto w ustawieniach systemu prosił o mniej ruchu, dostaje spokojną kreskę. */
@media ( prefers-reduced-motion: reduce ) {
	.lst-kroki::after { display: none; }
}

.lst-kafel { width: var( --lst-kafel ); height: var( --lst-kafel ); flex: none;
	display: grid; place-items: center;
	border: 1px solid rgba( 95, 227, 207, .3 ); border-radius: calc( 14px * var( --lst-skala ) );
	/* Kafelek ma własny, w pełni nieprzezroczysty kolor i stoi nad strzałką —
	   dzięki temu strzałka chowa się za nim, gdy przez niego przechodzi. */
	position: relative; z-index: 1;
	background: rgb( var( --lst-tlo ) );
	box-shadow: 0 0 calc( 30px * var( --lst-skala ) ) -12px rgba( 95, 227, 207, .5 ); }
.lst-kafel svg { width: calc( 26px * var( --lst-skala ) ); height: calc( 26px * var( --lst-skala ) ); display: block;
	fill: none; stroke: #5fe3cf; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

.lst-krok-tytul { display: block; margin-top: calc( 18px * var( --lst-skala ) );
	font-size: calc( 20px * var( --lst-skala ) ); font-weight: 600; letter-spacing: -.01em; color: #edf6f4; }

.lst-krok-opis { display: block; margin-top: calc( 9px * var( --lst-skala ) );
	font-family: ui-monospace, "IBM Plex Mono", Menlo, Consolas, monospace;
	font-size: calc( 16px * var( --lst-skala ) ); line-height: 1.7; color: #9bb2ae; }
.lst-krok-opis span { display: block; }

/* Na wąskim ekranie kroki stają jeden pod drugim, a kreska robi się pionowa. */
@media ( max-width: 780px ) {
	.lst-kroki { flex-direction: column; align-items: stretch; gap: calc( 30px * var( --lst-skala ) ); }
	.lst-krok + .lst-krok::before { top: calc( -1 * calc( 30px * var( --lst-skala ) ) - 4px ); height: calc( 30px * var( --lst-skala ) );
		left: 50%; right: auto; width: 1px;
		background: linear-gradient( to bottom, rgba( 95, 227, 207, 0 ), rgba( 95, 227, 207, .45 ), rgba( 95, 227, 207, 0 ) ); }

	/* W pionie jeden długi tor nie ma sensu — kroki są różnej wysokości.
	   Strzałka przeskakuje więc krótkimi odcinkami, od kafelka do kafelka. */
	.lst-kroki::after { display: none; }

	.lst-krok + .lst-krok::after { content: ""; position: absolute; z-index: 0; width: 0; height: 0;
		left: 50%; margin-left: calc( -4px * var( --lst-skala ) ); margin-top: 0;
		filter: drop-shadow( 0 0 calc( 5px * var( --lst-skala ) ) rgba( 95, 227, 207, .8 ) );
		/* backwards: zanim nadejdzie jej kolej, strzałka ma być niewidoczna,
		   a nie stać nieruchomo na górze. */
		animation: lst-plynie-w-dol 6s linear infinite backwards;
		border-left: calc( 4px * var( --lst-skala ) ) solid transparent;
		border-right: calc( 4px * var( --lst-skala ) ) solid transparent;
		border-top: calc( 7px * var( --lst-skala ) ) solid #5fe3cf;
		border-bottom: 0; }

	/* Każda rusza chwilę po poprzedniej, żeby to była jedna droga w dół. */
	.lst-krok:nth-child( 2 )::after { animation-delay: 0s; }
	.lst-krok:nth-child( 3 )::after { animation-delay: 2s; }
	.lst-krok:nth-child( 4 )::after { animation-delay: 4s; }

	@keyframes lst-plynie-w-dol {
		0%    { top: calc( -1 * calc( 30px * var( --lst-skala ) ) - 4px ); opacity: 0; }
		2%    { opacity: 1; }
		31%   { opacity: 1; }
		33%   { top: -4px; opacity: 0; }
		100%  { top: -4px; opacity: 0; }
	}
}
</style>
