<style>
/* ===========================================================================
   Cały pasek w jednym module. Wszystko pod .lst- , więc Divi zostaje nietknięte
   — i odwrotnie: żaden styl motywu tu nie wejdzie, bo każda reguła nazywa swój
   element wprost.
   =========================================================================== */
.lst-bar {
	/* ---- dwa pokrętła całego paska ----------------------------------- */

	/* Szerokość zawartości. 100% = od krawędzi do krawędzi ekranu.
	   Wpisz 1180px, jeśli wolisz, żeby trzymała się środka jak treść strony. */
	--lst-szer: 100%;

	/* Wielkość wszystkiego naraz. 1 = tak jak było, 1.3 = o trzydzieści
	   procent większe. Zmieniasz tę jedną liczbę, a wysokości, odstępy i
	   litery skalują się razem — nic się nie rozjeżdża względem reszty. */
	--lst-skala: 1.3;

	/* Wyliczone z powyższego. Tego nie trzeba ruszać. */
	--lst-h-gora: calc( 52px * var( --lst-skala ) );
	--lst-h-dol: calc( 41px * var( --lst-skala ) );
	--lst-bok: calc( 20px * var( --lst-skala ) );

	position: fixed; inset: 0 0 auto; z-index: 99999;
	background: rgba( 5, 11, 10, .93 ); backdrop-filter: blur( 10px ); -webkit-backdrop-filter: blur( 10px );
	border-bottom: 1px solid rgba( 120, 200, 190, .16 );
	font-family: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif; }

.lst-bar * { box-sizing: border-box; }

/* Edytory lubią wstawiać <br /> w miejsca złamanych wierszy. W pasku taki
   znacznik nie ma nic do roboty — gdyby się pojawił, ma być niewidoczny. */
.lst-bar br { display: none; }

.lst-top { display: flex; align-items: stretch; height: var( --lst-h-gora ); max-width: var( --lst-szer ); margin-inline: auto; }

.lst-mark { display: flex; align-items: center; gap: calc( .55rem * var( --lst-skala ) );
	padding-inline: var( --lst-bok ); flex: none;
	font-weight: 600; font-size: calc( .93rem * var( --lst-skala ) ); letter-spacing: -.02em;
	color: #edf6f4 !important; text-decoration: none !important; }
.lst-mark svg { width: calc( 24px * var( --lst-skala ) ); height: calc( 24px * var( --lst-skala ) ); flex: none; display: block; }
.lst-mark em { color: #5fe3cf; font-style: normal; }

.lst-fbar { flex: 1 1 auto; min-width: 0; display: flex; align-items: stretch;
	border-inline: 1px solid rgba( 120, 200, 190, .075 ); }

	padding-inline: calc( .6rem * var( --lst-skala ) ); flex: none;
	border-right: 1px solid rgba( 120, 200, 190, .075 );
	font-family: ui-monospace, "IBM Plex Mono", Menlo, Consolas, monospace;

	font-size: calc( .82rem * var( --lst-skala ) ); color: #9db3b0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
	transition: opacity .22s ease; }

.lst-cta { display: flex; align-items: center; padding-inline: var( --lst-bok ); flex: none; }
.lst-btn { display: inline-flex; align-items: center;
	padding: calc( .5rem * var( --lst-skala ) ) calc( 1.05rem * var( --lst-skala ) );
	border-radius: calc( 8px * var( --lst-skala ) );
	background: #5fe3cf; color: #04100e !important; font-size: calc( .87rem * var( --lst-skala ) ); font-weight: 600;

.lst-cols::-webkit-scrollbar { display: none; }

.lst-col { flex: 1 0 auto; min-width: calc( 108px * var( --lst-skala ) ); display: flex; align-items: center;
	gap: calc( .5rem * var( --lst-skala ) );
	padding-inline: calc( .85rem * var( --lst-skala ) ); border-right: 1px solid rgba( 120, 200, 190, .075 );
	font-family: ui-monospace, "IBM Plex Mono", Menlo, Consolas, monospace;

	transition: color .2s ease, background-color .3s ease; }

	.lst-fbar { display: none; }

<script>
( function () {
	'use strict';

	/*
	 * Moduł stoi na samej górze strony, więc w chwili, gdy ten skrypt się
	 * wykonuje, sekcji pod nim jeszcze nie ma — przeglądarka ich nie doczytała.
	 * Budowanie przycisków teraz dałoby pasek bez ani jednego przycisku, bez
	 * żadnego błędu w konsoli. Czekamy, aż strona będzie kompletna.
	 */
	function start() {

	var pasek = document.getElementById( 'lst-bar' );
	var ref = document.getElementById( 'lst-ref' );
	var zdanie = document.getElementById( 'lst-say' );

	if ( ! pasek || ! ref || ! zdanie ) {
		return;
	}

	/*
	 * Pasek stoi nad treścią, więc strona musi zacząć się pod nim. Mierzymy go
	 * zamiast wpisywać wysokość na sztywno: zmieni się po dołożeniu siódmej
	 * sekcji albo przy innym kroju pisma, a odstęp ma nadążyć.
	 */
	function odsun() {
		document.body.style.paddingTop = pasek.offsetHeight + 'px';
	}

	odsun();
	window.addEventListener( 'resize', odsun, { passive: true } );

	/*
	 * Motywy — Divi wśród nich — podpinają „płynne przewijanie" pod każdy
	 * odnośnik z kratką i potrafią anulować kliknięcie. Tu przewijanie jest
	 * tym, czego chcemy, więc robimy je sami i mamy pewność, że się wydarzy.
	 */
	pasek.addEventListener( 'click', function ( event ) {
		var odnosnik = event.target.closest ? event.target.closest( 'a[href^="#"]' ) : null;

		if ( ! odnosnik ) {
			return;
		}

		var cel = document.getElementById( ( odnosnik.getAttribute( 'href' ) || '' ).slice( 1 ) );

		if ( ! cel ) {
			return;
		}

		event.preventDefault();
		window.scrollTo( {
			top: cel.getBoundingClientRect().top + window.pageYOffset - pasek.offsetHeight,
			behavior: 'smooth'
		} );
	} );

	/*
	 * Lista sekcji — czytana z przycisków, które stoją wyżej w kodzie. Skrypt
	 * niczego nie tworzy, więc przyciski są widoczne zawsze: w Kreatorze
	 * motywu, w podglądzie, nawet gdyby skrypt się nie wykonał.
	 */
	var kolumny = Array.prototype.slice.call( pasek.querySelectorAll( '.lst-col' ) );

	var SEKCJE = kolumny.map( function ( guzik ) {
		return {
			id: ( guzik.getAttribute( 'href' ) || '' ).slice( 1 ),
			ref: guzik.getAttribute( 'data-ref' ) || '',
			zdanie: guzik.getAttribute( 'data-say' ) || '',
			guzik: guzik
		};
	} );

	/*
	 * Przycisk do sekcji, której na stronie nie ma, prowadziłby donikąd —
	 * chowamy go. Ale tylko wtedy, gdy choć jedna sekcja się znalazła: gdy nie
	 * ma żadnej, oglądamy sam nagłówek bez strony pod nim (Kreator motywu) i
	 * wszystkie przyciski mają zostać widoczne.
	 */
	var znalezione = SEKCJE.filter( function ( s ) {
		return !! document.getElementById( s.id );
	} );

	if ( znalezione.length ) {
		SEKCJE.forEach( function ( s ) {
			if ( ! document.getElementById( s.id ) ) {
				s.guzik.style.display = 'none';
			}
		} );
	}
	var teraz = '';
	var czeka = false;

	function patrz() {
		czeka = false;

		var prog = window.innerHeight * 0.42;
		var wybrana = SEKCJE[ 0 ];

		SEKCJE.forEach( function ( sekcja ) {
			var el = document.getElementById( sekcja.id );

			if ( el && el.getBoundingClientRect().top <= prog ) {
				wybrana = sekcja;
			}
		} );

		if ( ! wybrana || wybrana.id === teraz ) {
			return;
		}

		teraz = wybrana.id;
		ref.textContent = wybrana.ref;

		zdanie.classList.add( 'is-swapping' );

		window.setTimeout( function () {
			zdanie.innerHTML = wybrana.zdanie;
			zdanie.classList.remove( 'is-swapping' );
		}, 220 );

		SEKCJE.forEach( function ( sekcja ) {
			sekcja.guzik.classList.toggle( 'is-on', sekcja.id === teraz );
		} );
	}

	window.addEventListener( 'scroll', function () {
		if ( ! czeka ) {
			czeka = true;
			window.requestAnimationFrame( patrz );
		}
	}, { passive: true } );

	patrz();

	}

	if ( 'loading' === document.readyState ) {
		document.addEventListener( 'DOMContentLoaded', start );
	} else {
		start();
	}
}() );
</script>
