<script>
( function () {
	'use strict';

	/*
	 * Moduł stoi na samej górze strony, więc w chwili, gdy ten skrypt się
	 * wykonuje, sekcji pod nim jeszcze nie ma — przeglądarka ich nie doczytała.
	 * Budowanie przycisków teraz dałoby pasek bez ani jednego przycisku, bez
	 * żadnego błędu w konsoli. Czekamy, aż strona będzie kompletna.
	 */
	function start() {

	var pasek = document.getElementById( 'lst-bar' );
	var ref = document.getElementById( 'lst-ref' );
	var zdanie = document.getElementById( 'lst-say' );

	if ( ! pasek || ! ref || ! zdanie ) {
		return;
	}

	/*
	 * Pasek stoi nad treścią, więc strona musi zacząć się pod nim. Mierzymy go
	 * zamiast wpisywać wysokość na sztywno: zmieni się po dołożeniu siódmej
	 * sekcji albo przy innym kroju pisma, a odstęp ma nadążyć.
	 */
	function odsun() {
		document.body.style.paddingTop = pasek.offsetHeight + 'px';
	}

	odsun();
	window.addEventListener( 'resize', odsun, { passive: true } );

	var kolumnyNav = document.getElementById( 'lst-cols' );

	/* Przycisk podstrony, na której właśnie jesteś, świeci mocniej. */
	var tutaj = window.location.pathname.replace( /\/+$/, '' );
	Array.prototype.forEach.call( pasek.querySelectorAll( '.lst-metal' ), function ( guzik ) {
		var adres = ( guzik.getAttribute( 'href' ) || '' ).replace( /\/+$/, '' );
		if ( adres && adres === tutaj ) {
			guzik.classList.add( 'is-here' );
			guzik.setAttribute( 'aria-current', 'page' );
		}
	} );

	/*
	 * Motywy — Divi wśród nich — podpinają „płynne przewijanie" pod każdy
	 * odnośnik z kratką i potrafią anulować kliknięcie. Tu przewijanie jest
	 * tym, czego chcemy, więc robimy je sami i mamy pewność, że się wydarzy.
	 */
	pasek.addEventListener( 'click', function ( event ) {
		var odnosnik = event.target.closest ? event.target.closest( 'a[href^="#"]' ) : null;

		if ( ! odnosnik ) {
			return;
		}

		var cel = document.getElementById( ( odnosnik.getAttribute( 'href' ) || '' ).slice( 1 ) );

		/*
		 * Na podstronie (kontakt, „jak to działa”) sekcji strony głównej nie
		 * ma. Kliknięta kolumna prowadzi wtedy na stronę główną, prosto do
		 * swojej sekcji, zamiast nie robić nic.
		 */
		if ( ! cel ) {
			var glowna = kolumnyNav ? kolumnyNav.getAttribute( 'data-start' ) : '';
			if ( glowna && window.location.pathname !== glowna ) {
				event.preventDefault();
				window.location.href = glowna + odnosnik.getAttribute( 'href' );
			}
			return;
		}

		event.preventDefault();
		window.scrollTo( {
			top: cel.getBoundingClientRect().top + window.pageYOffset - pasek.offsetHeight,
			behavior: 'smooth'
		} );
	} );

	/*
	 * Lista sekcji — czytana z przycisków, które stoją wyżej w kodzie. Skrypt
	 * niczego nie tworzy, więc przyciski są widoczne zawsze: w Kreatorze
	 * motywu, w podglądzie, nawet gdyby skrypt się nie wykonał.
	 */
	var kolumny = Array.prototype.slice.call( pasek.querySelectorAll( '.lst-col' ) );

	var SEKCJE = kolumny.map( function ( guzik ) {
		return {
			id: ( guzik.getAttribute( 'href' ) || '' ).slice( 1 ),
			ref: guzik.getAttribute( 'data-ref' ) || '',
			zdanie: guzik.getAttribute( 'data-say' ) || '',
			guzik: guzik
		};
	} );

	/*
	 * Przycisk do sekcji, której na stronie nie ma, prowadziłby donikąd —
	 * chowamy go. Ale tylko wtedy, gdy choć jedna sekcja się znalazła: gdy nie
	 * ma żadnej, oglądamy sam nagłówek bez strony pod nim (Kreator motywu) i
	 * wszystkie przyciski mają zostać widoczne.
	 */
	var znalezione = SEKCJE.filter( function ( s ) {
		return !! document.getElementById( s.id );
	} );

	if ( znalezione.length ) {
		SEKCJE.forEach( function ( s ) {
			if ( ! document.getElementById( s.id ) ) {
				s.guzik.style.display = 'none';
			}
		} );
	}
	var teraz = '';
	var czeka = false;

	function patrz() {
		czeka = false;

		var prog = window.innerHeight * 0.42;
		var wybrana = SEKCJE[ 0 ];

		SEKCJE.forEach( function ( sekcja ) {
			var el = document.getElementById( sekcja.id );

			if ( el && el.getBoundingClientRect().top <= prog ) {
				wybrana = sekcja;
			}
		} );

		if ( ! wybrana || wybrana.id === teraz ) {
			return;
		}

		teraz = wybrana.id;
		ref.textContent = wybrana.ref;

		zdanie.classList.add( 'is-swapping' );

		window.setTimeout( function () {
			zdanie.innerHTML = wybrana.zdanie;
			zdanie.classList.remove( 'is-swapping' );
		}, 220 );

		SEKCJE.forEach( function ( sekcja ) {
			sekcja.guzik.classList.toggle( 'is-on', sekcja.id === teraz );
		} );
	}

	window.addEventListener( 'scroll', function () {
		if ( ! czeka ) {
			czeka = true;
			window.requestAnimationFrame( patrz );
		}
	}, { passive: true } );

	patrz();

	}

	if ( 'loading' === document.readyState ) {
		document.addEventListener( 'DOMContentLoaded', start );
	} else {
		start();
	}
}() );
</script>
